plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { ashenprotocol { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }
tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') { expand mod_version: mod_version }
}
tasks.named('jar', Jar).configure {
    manifest { attributes 'Implementation-Version': mod_version, 'Implementation-Vendor': 'yuniaries' }
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

if (providers.gradleProperty('runtimeProbe').isPresent()) {
    sourceSets.main.java.srcDir 'src/runtimeTest/java'
}
